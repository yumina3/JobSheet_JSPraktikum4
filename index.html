<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Product List</title>
</head>
<body>
  <div id="product-list"></div>

  <script>
    function renderProducts(products) {
      const container = document.querySelector("#product-list");
      container.innerHTML = "";

      for (const product of products) {
        const card = document.createElement("div");
        card.classList.add("product-card");
        card.innerHTML = `
          <img src="${product.thumbnail}" alt="${product.title}">
          <h3>${product.title}</h3>
          <p>${product.category}</p>
          <p>Harga: $${product.price}</p>
          <p>Rating: ${product.rating}</p>
        `;
        container.append(card);
      }
    }

    const dummyProducts = [
      { title: "Wireless Mouse", category: "Electronics", price: 25, rating: 4.5, thumbnail: "https://via.placeholder.com/150" },
      { title: "Bluetooth Speaker", category: "Electronics", price: 40, rating: 4.2, thumbnail: "https://via.placeholder.com/150" },
      { title: "Running Shoes", category: "Fashion", price: 60, rating: 4.7, thumbnail: "https://via.placeholder.com/150" },
      { title: "Coffee Maker", category: "Home Appliance", price: 80, rating: 4.3, thumbnail: "https://via.placeholder.com/150" },
      { title: "Backpack", category: "Fashion", price: 35, rating: 4.6, thumbnail: "https://via.placeholder.com/150" }
    ];

    renderProducts(dummyProducts);
  </script>
</body>
</html>
